name: Deploy signed ECS application
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Plan publishes/verifies an image and previews AWS application changes. Apply deploys; destroy removes the app.
        type: choice
        default: plan
        options: [plan, apply, destroy]
permissions:
  contents: read
concurrency:
  group: selfbuild-aws-application
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/security.yml

  deployment:
    name: Signed image and Terraform deployment
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      EXECUTION_ROLE_ARN: ${{ vars.EXECUTION_ROLE_ARN }}
      TASK_ROLE_ARN: ${{ vars.TASK_ROLE_ARN }}
      ALLOWED_CIDR: ${{ secrets.ALLOWED_CIDR }}
      PROJECT_NAME: devsecops-selfbuild
      OPERATION: ${{ inputs.operation }}
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate setup
        run: |
          test -n "$TF_STATE_BUCKET" && test -n "$EXECUTION_ROLE_ARN" && test -n "$TASK_ROLE_ARN" && test -n "$ALLOWED_CIDR"
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          [[ "$ALLOWED_CIDR" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}/32$ ]]
          [[ "$OPERATION" =~ ^(plan|apply|destroy)$ ]]
          echo "REGISTRY=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com" >> "$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: selfbuild-${{ github.run_id }}
      - run: aws sts get-caller-identity
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: inputs.operation != 'destroy'
        with:
          name: tested-image-${{ github.sha }}
          path: reports/
      - name: Publish the tested artifact
        if: inputs.operation != 'destroy'
        run: |
          sha256sum -c reports/image.tar.sha256
          docker load -i reports/image.tar
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
          existing=$(aws ecr describe-images --repository-name "$PROJECT_NAME" --output json | jq -r --arg tag "$GITHUB_SHA" '[.imageDetails[] | select((.imageTags // []) | index($tag)) | .imageDigest][0] // empty')
          if [ "$existing" = None ] || [ -z "$existing" ]; then
            docker tag devsecops-selfbuild:ci "$REGISTRY/$PROJECT_NAME:$GITHUB_SHA"
            docker push "$REGISTRY/$PROJECT_NAME:$GITHUB_SHA"
            digest=$(aws ecr describe-images --repository-name "$PROJECT_NAME" --image-ids imageTag="$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text)
          else
            digest="$existing"
          fi
          echo "IMAGE_REF=$REGISTRY/$PROJECT_NAME@$digest" >> "$GITHUB_ENV"
      - name: Scan the registry digest used for this deployment
        if: inputs.operation != 'destroy'
        run: |
          docker run --rm -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_SESSION_TOKEN -e AWS_REGION             aquasec/trivy:0.76.2 image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 "$IMAGE_REF"
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
        if: inputs.operation != 'destroy'
        with:
          cosign-release: v3.0.3
      - name: Sign and verify the exact image identity
        if: inputs.operation != 'destroy'
        run: |
          cosign sign --yes "$IMAGE_REF"
          cosign verify "$IMAGE_REF"             --certificate-identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/deploy.yml@refs/heads/main"             --certificate-oidc-issuer=https://token.actions.githubusercontent.com
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.14.0'
          terraform_wrapper: false
      - name: Initialize isolated state
        run: |
          terraform -chdir=terraform init -input=false             -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=$AWS_REGION"             -backend-config="key=application/terraform.tfstate"             -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - name: Make a saved application plan
        run: |
          args=()
          if [ "$OPERATION" = destroy ]; then
            args+=(-destroy)
            IMAGE_REF=$(terraform -chdir=terraform output -raw deployed_image)
            echo "IMAGE_REF=$IMAGE_REF" >> "$GITHUB_ENV"
          fi
          export TF_VAR_aws_region="$AWS_REGION" TF_VAR_aws_account_id="$AWS_ACCOUNT_ID"
          export TF_VAR_image_ref="$IMAGE_REF" TF_VAR_app_version="$GITHUB_SHA"
          export TF_VAR_allowed_cidr="$ALLOWED_CIDR" TF_VAR_execution_role_arn="$EXECUTION_ROLE_ARN" TF_VAR_task_role_arn="$TASK_ROLE_ARN"
          terraform -chdir=terraform plan -lock-timeout=60s -out=application.tfplan "${args[@]}"
          terraform -chdir=terraform show -no-color application.tfplan
      - name: Apply only when explicitly selected
        if: inputs.operation != 'plan'
        run: terraform -chdir=terraform apply -input=false -lock-timeout=60s application.tfplan
      - name: Verify ECS task health and deployed image
        if: inputs.operation == 'apply'
        run: bash scripts/verify-service.sh
