{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "Separate OIDC, state, registry and ECS runtime roles for the self-build learning project.",
  "Parameters": {
    "GitHubOwner": {
      "Type": "String",
      "Default": "harish6988-ux"
    },
    "GitHubRepository": {
      "Type": "String",
      "Default": "devsecops-selfbuild"
    },
    "GitHubOwnerID": {
      "Type": "String",
      "Default": "278762787",
      "AllowedPattern": "[0-9]+"
    },
    "GitHubRepositoryID": {
      "Type": "String",
      "Default": "1469847099",
      "AllowedPattern": "[0-9]+"
    },
    "CreateGitHubProvider": {
      "Type": "String",
      "Default": "false",
      "AllowedValues": [
        "true",
        "false"
      ],
      "Description": "Keep false when the existing account already has the GitHub OIDC provider."
    }
  },
  "Conditions": {
    "NeedsProvider": {
      "Fn::Equals": [
        {
          "Ref": "CreateGitHubProvider"
        },
        "true"
      ]
    }
  },
  "Resources": {
    "GitHubProvider": {
      "Type": "AWS::IAM::OIDCProvider",
      "Condition": "NeedsProvider",
      "Properties": {
        "Url": "https://token.actions.githubusercontent.com",
        "ClientIdList": [
          "sts.amazonaws.com"
        ]
      }
    },
    "StateBucket": {
      "Type": "AWS::S3::Bucket",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "VersioningConfiguration": {
          "Status": "Enabled"
        },
        "BucketEncryption": {
          "ServerSideEncryptionConfiguration": [
            {
              "ServerSideEncryptionByDefault": {
                "SSEAlgorithm": "AES256"
              }
            }
          ]
        },
        "PublicAccessBlockConfiguration": {
          "BlockPublicAcls": true,
          "BlockPublicPolicy": true,
          "IgnorePublicAcls": true,
          "RestrictPublicBuckets": true
        },
        "OwnershipControls": {
          "Rules": [
            {
              "ObjectOwnership": "BucketOwnerEnforced"
            }
          ]
        },
        "Tags": [
          {
            "Key": "Project",
            "Value": "devsecops-selfbuild"
          }
        ]
      }
    },
    "StateBucketPolicy": {
      "Type": "AWS::S3::BucketPolicy",
      "Properties": {
        "Bucket": {
          "Ref": "StateBucket"
        },
        "PolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Deny",
              "Principal": "*",
              "Action": "s3:*",
              "Resource": [
                {
                  "Fn::GetAtt": [
                    "StateBucket",
                    "Arn"
                  ]
                },
                {
                  "Fn::Sub": "${StateBucket.Arn}/*"
                }
              ],
              "Condition": {
                "Bool": {
                  "aws:SecureTransport": "false"
                }
              }
            }
          ]
        }
      }
    },
    "Registry": {
      "Type": "AWS::ECR::Repository",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "RepositoryName": "devsecops-selfbuild",
        "ImageTagMutability": "IMMUTABLE",
        "EncryptionConfiguration": {
          "EncryptionType": "AES256"
        },
        "ImageScanningConfiguration": {
          "ScanOnPush": true
        },
        "Tags": [
          {
            "Key": "Project",
            "Value": "devsecops-selfbuild"
          }
        ]
      }
    },
    "ExecutionRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "ecs-tasks.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        },
        "Policies": [
          {
            "PolicyName": "PullOwnImageAndWriteLogs",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Sid": "RegistryAuthentication",
                  "Effect": "Allow",
                  "Action": "ecr:GetAuthorizationToken",
                  "Resource": "*"
                },
                {
                  "Sid": "ReadOwnImages",
                  "Effect": "Allow",
                  "Action": [
                    "ecr:BatchGetImage",
                    "ecr:GetDownloadUrlForLayer",
                    "ecr:BatchCheckLayerAvailability"
                  ],
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/devsecops-selfbuild"
                  }
                },
                {
                  "Sid": "WriteOwnLogs",
                  "Effect": "Allow",
                  "Action": [
                    "logs:CreateLogStream",
                    "logs:PutLogEvents"
                  ],
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/devsecops-selfbuild:*"
                  }
                }
              ]
            }
          }
        ]
      }
    },
    "TaskRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "ecs-tasks.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        },
        "Description": "Application identity; intentionally has no AWS permissions."
      }
    },
    "GitHubDeployRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "MaxSessionDuration": 3600,
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Federated": {
                  "Fn::If": [
                    "NeedsProvider",
                    {
                      "Ref": "GitHubProvider"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
                    }
                  ]
                }
              },
              "Action": "sts:AssumeRoleWithWebIdentity",
              "Condition": {
                "StringEquals": {
                  "token.actions.githubusercontent.com:aud": "sts.amazonaws.com",
                  "token.actions.githubusercontent.com:sub": {
                    "Fn::Sub": "repo:${GitHubOwner}@${GitHubOwnerID}/${GitHubRepository}@${GitHubRepositoryID}:ref:refs/heads/main"
                  }
                }
              }
            }
          ]
        },
        "Policies": [
          {
            "PolicyName": "SelfbuildDeployment",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Sid": "StateBucketMetadata",
                  "Effect": "Allow",
                  "Action": [
                    "s3:ListBucket",
                    "s3:GetBucketLocation"
                  ],
                  "Resource": {
                    "Fn::GetAtt": [
                      "StateBucket",
                      "Arn"
                    ]
                  }
                },
                {
                  "Sid": "ReadWriteState",
                  "Effect": "Allow",
                  "Action": [
                    "s3:GetObject",
                    "s3:PutObject"
                  ],
                  "Resource": {
                    "Fn::Sub": "${StateBucket.Arn}/application/terraform.tfstate"
                  }
                },
                {
                  "Sid": "ManageStateLock",
                  "Effect": "Allow",
                  "Action": [
                    "s3:GetObject",
                    "s3:PutObject",
                    "s3:DeleteObject"
                  ],
                  "Resource": {
                    "Fn::Sub": "${StateBucket.Arn}/application/terraform.tfstate.tflock"
                  }
                },
                {
                  "Sid": "ECRAuthentication",
                  "Effect": "Allow",
                  "Action": "ecr:GetAuthorizationToken",
                  "Resource": "*"
                },
                {
                  "Sid": "ProjectRegistry",
                  "Effect": "Allow",
                  "Action": [
                    "ecr:DescribeRepositories",
                    "ecr:DescribeImages",
                    "ecr:ListImages",
                    "ecr:BatchCheckLayerAvailability",
                    "ecr:GetDownloadUrlForLayer",
                    "ecr:BatchGetImage",
                    "ecr:InitiateLayerUpload",
                    "ecr:UploadLayerPart",
                    "ecr:CompleteLayerUpload",
                    "ecr:PutImage",
                    "ecr:BatchDeleteImage"
                  ],
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/devsecops-selfbuild"
                  }
                },
                {
                  "Sid": "NetworkRead",
                  "Effect": "Allow",
                  "Action": "ec2:Describe*",
                  "Resource": "*",
                  "Condition": {
                    "StringEquals": {
                      "aws:RequestedRegion": {
                        "Ref": "AWS::Region"
                      }
                    }
                  }
                },
                {
                  "Sid": "CreateTaggedNetwork",
                  "Effect": "Allow",
                  "Action": [
                    "ec2:CreateVpc",
                    "ec2:CreateSubnet",
                    "ec2:CreateRouteTable",
                    "ec2:CreateInternetGateway",
                    "ec2:CreateSecurityGroup"
                  ],
                  "Resource": "*",
                  "Condition": {
                    "StringEquals": {
                      "aws:RequestedRegion": {
                        "Ref": "AWS::Region"
                      },
                      "aws:RequestTag/Project": "devsecops-selfbuild"
                    }
                  }
                },
                {
                  "Sid": "TagNewNetwork",
                  "Effect": "Allow",
                  "Action": "ec2:CreateTags",
                  "Resource": [
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc/*"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/*"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:route-table/*"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:internet-gateway/*"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*"
                    }
                  ],
                  "Condition": {
                    "StringEquals": {
                      "ec2:CreateAction": [
                        "CreateVpc",
                        "CreateSubnet",
                        "CreateRouteTable",
                        "CreateInternetGateway",
                        "CreateSecurityGroup"
                      ]
                    }
                  }
                },
                {
                  "Sid": "ManageProjectNetwork",
                  "Effect": "Allow",
                  "Action": [
                    "ec2:DeleteVpc",
                    "ec2:ModifyVpcAttribute",
                    "ec2:DeleteSubnet",
                    "ec2:ModifySubnetAttribute",
                    "ec2:DeleteRouteTable",
                    "ec2:CreateRoute",
                    "ec2:DeleteRoute",
                    "ec2:AssociateRouteTable",
                    "ec2:DisassociateRouteTable",
                    "ec2:AttachInternetGateway",
                    "ec2:DetachInternetGateway",
                    "ec2:DeleteInternetGateway",
                    "ec2:AuthorizeSecurityGroupIngress",
                    "ec2:RevokeSecurityGroupIngress",
                    "ec2:AuthorizeSecurityGroupEgress",
                    "ec2:RevokeSecurityGroupEgress",
                    "ec2:DeleteSecurityGroup",
                    "ec2:CreateTags",
                    "ec2:DeleteTags"
                  ],
                  "Resource": [
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc/*"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/*"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:route-table/*"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:internet-gateway/*"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*"
                    }
                  ],
                  "Condition": {
                    "StringEquals": {
                      "ec2:ResourceTag/Project": "devsecops-selfbuild"
                    }
                  }
                },
                {
                  "Sid": "ECSRead",
                  "Effect": "Allow",
                  "Action": [
                    "ecs:DescribeClusters",
                    "ecs:DescribeServices",
                    "ecs:DescribeTasks",
                    "ecs:DescribeTaskDefinition",
                    "ecs:ListTasks",
                    "ecs:ListTagsForResource"
                  ],
                  "Resource": "*",
                  "Condition": {
                    "StringEquals": {
                      "aws:RequestedRegion": {
                        "Ref": "AWS::Region"
                      }
                    }
                  }
                },
                {
                  "Sid": "ProjectECS",
                  "Effect": "Allow",
                  "Action": [
                    "ecs:CreateCluster",
                    "ecs:DeleteCluster",
                    "ecs:CreateService",
                    "ecs:UpdateService",
                    "ecs:DeleteService",
                    "ecs:DeregisterTaskDefinition",
                    "ecs:TagResource",
                    "ecs:UntagResource"
                  ],
                  "Resource": [
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/devsecops-selfbuild"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/devsecops-selfbuild/devsecops-selfbuild"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task/devsecops-selfbuild/*"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/devsecops-selfbuild:*"
                    }
                  ]
                },
                {
                  "Sid": "RegisterTaggedTask",
                  "Effect": "Allow",
                  "Action": "ecs:RegisterTaskDefinition",
                  "Resource": "*",
                  "Condition": {
                    "StringEquals": {
                      "aws:RequestTag/Project": "devsecops-selfbuild",
                      "aws:RequestedRegion": {
                        "Ref": "AWS::Region"
                      }
                    }
                  }
                },
                {
                  "Sid": "PassOnlyProjectRoles",
                  "Effect": "Allow",
                  "Action": "iam:PassRole",
                  "Resource": [
                    {
                      "Fn::GetAtt": [
                        "ExecutionRole",
                        "Arn"
                      ]
                    },
                    {
                      "Fn::GetAtt": [
                        "TaskRole",
                        "Arn"
                      ]
                    }
                  ],
                  "Condition": {
                    "StringEquals": {
                      "iam:PassedToService": "ecs-tasks.amazonaws.com"
                    }
                  }
                },
                {
                  "Sid": "ECSServiceLinkedRole",
                  "Effect": "Allow",
                  "Action": "iam:CreateServiceLinkedRole",
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/ecs.amazonaws.com/AWSServiceRoleForECS*"
                  },
                  "Condition": {
                    "StringEquals": {
                      "iam:AWSServiceName": "ecs.amazonaws.com"
                    }
                  }
                },
                {
                  "Sid": "ManageProjectLogs",
                  "Effect": "Allow",
                  "Action": [
                    "logs:CreateLogGroup",
                    "logs:DeleteLogGroup",
                    "logs:PutRetentionPolicy",
                    "logs:DeleteRetentionPolicy",
                    "logs:ListTagsForResource",
                    "logs:TagResource",
                    "logs:UntagResource",
                    "logs:TagLogGroup",
                    "logs:UntagLogGroup"
                  ],
                  "Resource": [
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/devsecops-selfbuild:*"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/devsecops-selfbuild"
                    }
                  ]
                },
                {
                  "Sid": "DescribeLogGroups",
                  "Effect": "Allow",
                  "Action": "logs:DescribeLogGroups",
                  "Resource": "*"
                }
              ]
            }
          }
        ]
      }
    }
  },
  "Outputs": {
    "AWSAccountID": {
      "Value": {
        "Ref": "AWS::AccountId"
      }
    },
    "AWSRegion": {
      "Value": {
        "Ref": "AWS::Region"
      }
    },
    "AWSRoleARN": {
      "Value": {
        "Fn::GetAtt": [
          "GitHubDeployRole",
          "Arn"
        ]
      }
    },
    "TFStateBucket": {
      "Value": {
        "Ref": "StateBucket"
      }
    },
    "ExecutionRoleARN": {
      "Value": {
        "Fn::GetAtt": [
          "ExecutionRole",
          "Arn"
        ]
      }
    },
    "TaskRoleARN": {
      "Value": {
        "Fn::GetAtt": [
          "TaskRole",
          "Arn"
        ]
      }
    },
    "RepositoryURL": {
      "Value": {
        "Fn::GetAtt": [
          "Registry",
          "RepositoryUri"
        ]
      }
    }
  }
}
